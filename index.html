<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zhao Hai Radio — Live Online Radio</title>
<meta name="description" content="Zhao Hai Radio — streaming live music 24/7. Listen online now." />

<style>
  :root {
    --accent: #67CA22;
    --accent-glow: rgba(103, 202, 34, 0.45);
    --bg: #0a0c0a;
    --bg-2: #101410;
    --surface: rgba(22, 27, 22, 0.72);
    --border: rgba(103, 202, 34, 0.18);
    --text: #e8f0e4;
    --text-dim: #8a968a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient background glows */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    width: 520px;
    height: 520px;
    background: rgba(103, 202, 34, 0.14);
    top: -180px;
    left: -140px;
  }

  body::after {
    width: 460px;
    height: 460px;
    background: rgba(103, 202, 34, 0.08);
    bottom: -200px;
    right: -120px;
  }

  /* Faint grid overlay */
  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(103, 202, 34, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(103, 202, 34, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 76px;
    height: 76px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #1a211a, #0d100d);
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.02) inset,
      0 12px 40px rgba(0, 0, 0, 0.6),
      0 0 44px -8px var(--accent-glow);
    position: relative;
  }

  .logo svg { width: 38px; height: 38px; }

  h1 {
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    background: linear-gradient(180deg, #ffffff 20%, #b9d6a8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    font-size: 0.95rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  /* ---------- Live badge ---------- */
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 11px;
    border-radius: 999px;
    background: rgba(103, 202, 34, 0.08);
    border: 1px solid var(--border);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-glow);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(103, 202, 34, 0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(103, 202, 34, 0); }
    100% { box-shadow: 0 0 0 0 rgba(103, 202, 34, 0); }
  }

  /* ---------- Player card ---------- */
  .player-card {
    width: 100%;
    background: var(--surface);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 26px 22px;
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.55),
      0 0 60px -30px var(--accent-glow);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .player-card:hover {
    border-color: rgba(103, 202, 34, 0.35);
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.55),
      0 0 70px -24px var(--accent-glow);
  }

  .player-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .player-label .title {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* Equalizer bars */
  .eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 18px;
  }

  .eq span {
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    opacity: 0.85;
    animation: bounce 1.1s ease-in-out infinite;
  }

  .eq span:nth-child(1) { animation-delay: 0s;    height: 40%; }
  .eq span:nth-child(2) { animation-delay: 0.15s; height: 75%; }
  .eq span:nth-child(3) { animation-delay: 0.3s;  height: 55%; }
  .eq span:nth-child(4) { animation-delay: 0.45s; height: 90%; }
  .eq span:nth-child(5) { animation-delay: 0.6s;  height: 50%; }

  @keyframes bounce {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }

  /* ---------- Embedded widget container ---------- */
  .embed-slot {
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.04);
    padding: 12px 8px;
    overflow: hidden;
  }

  .embed-slot .cstrEmbed {
    width: 100%;
  }

  /* Fallback / loading text before the widget renders */
  .embed-slot .cstrEmbed:not([data-rendered="true"])::before {
    content: "Loading player…";
    display: block;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 30px 0;
  }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    line-height: 1.8;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }

  footer a:hover {
    border-bottom-color: var(--accent);
  }

  @media (max-width: 480px) {
    body { padding: 24px 14px; }
    .player-card { padding: 20px 14px; border-radius: 18px; }
    .logo { width: 64px; height: 64px; border-radius: 18px; }
    .logo svg { width: 32px; height: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="wrapper">

    <!-- ===== Header ===== -->
    <header>
      <div class="logo" aria-hidden="true">
        <!-- Radio wave icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#67CA22" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="2.4" fill="#67CA22" stroke="none"/>
          <path d="M7.8 7.8a6 6 0 0 0 0 8.4"/>
          <path d="M16.2 16.2a6 6 0 0 0 0-8.4"/>
          <path d="M4.9 4.9a10 10 0 0 0 0 14.2"/>
          <path d="M19.1 19.1a10 10 0 0 0 0-14.2"/>
        </svg>
      </div>

      <div class="live-badge">
        <span class="dot"></span>
        On Air
      </div>

      <h1>Zhao Hai Radio</h1>
      <p class="tagline">Streaming live, around the clock</p>
    </header>

    <!-- ===== Player ===== -->
    <main class="player-card">
      <div class="player-label">
        <span class="title">Now Playing</span>
        <div class="eq" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="embed-slot">
        <!-- ===== Caster.fm Embedded Widget ===== -->
        <div data-type="newStreamPlayer"
             data-publicToken="9d019c31-94e9-470d-807a-2fbfb6df2457"
             data-theme="dark"
             data-color="67CA22"
             data-channelId=""
             data-rendered="false"
             class="cstrEmbed">
          <a href="https://www.caster.fm">Shoutcast Hosting</a>
          <a href="https://www.caster.fm">Stream Hosting</a>
          <a href="https://www.caster.fm">Radio Server Hosting</a>
        </div>
        <!-- ===== /Caster.fm Widget ===== -->
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer>
      &copy; <span id="year"></span> Zhao Hai Radio &middot; All rights reserved<br />
      Powered by <a href="https://www.caster.fm" target="_blank" rel="noopener">Caster.fm</a>
    </footer>

  </div>

  <!-- Dynamic copyright year -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <!-- ===== Caster.fm Embed Script (must come after the widget div) ===== -->
  <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
</body>
</html>
