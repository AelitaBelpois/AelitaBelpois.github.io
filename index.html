<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zhao Hai Radio — Live Online Radio</title>
<meta name="description" content="Zhao Hai Radio — streaming live music 24/7. Listen online now." />

<style>
  :root {
    --accent: #67CA22;
    --accent-glow: rgba(103, 202, 34, 0.45);
    --bg: #0a0c0a;
    --surface: rgba(22, 27, 22, 0.72);
    --border: rgba(103, 202, 34, 0.18);
    --text: #e8f0e4;
    --text-dim: #8a968a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient background glows */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 520px; height: 520px;
    background: rgba(103, 202, 34, 0.14);
    top: -180px; left: -140px;
  }
  body::after {
    width: 460px; height: 460px;
    background: rgba(103, 202, 34, 0.08);
    bottom: -200px; right: -120px;
  }

  /* Faint grid overlay */
  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(103, 202, 34, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(103, 202, 34, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 76px;
    height: 76px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #1a211a, #0d100d);
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.02) inset,
      0 12px 40px rgba(0, 0, 0, 0.6),
      0 0 44px -8px var(--accent-glow);
    position: relative;
  }
  .logo svg { width: 38px; height: 38px; }

  h1 {
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    background: linear-gradient(180deg, #ffffff 20%, #b9d6a8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    font-size: 0.95rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  /* ---------- Live badge ---------- */
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 11px;
    border-radius: 999px;
    background: rgba(103, 202, 34, 0.08);
    border: 1px solid var(--border);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    transition: color .35s ease, background-color .35s ease, border-color .35s ease;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-glow);
    animation: pulse 2s infinite;
    transition: background-color .35s ease;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(103, 202, 34, 0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(103, 202, 34, 0); }
    100% { box-shadow: 0 0 0 0 rgba(103, 202, 34, 0); }
  }

  /* Idle / standby look for the badge */
  .live-badge.is-idle {
    color: var(--text-dim);
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.08);
  }
  .live-badge.is-idle .dot {
    background: var(--text-dim);
    animation: none;
    box-shadow: none;
    opacity: .7;
  }

  /* ---------- Player card ---------- */
  .player-card {
    width: 100%;
    background: var(--surface);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 26px 22px;
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.55),
      0 0 60px -30px var(--accent-glow);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .player-card:hover {
    border-color: rgba(103, 202, 34, 0.35);
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.55),
      0 0 70px -24px var(--accent-glow);
  }

  .player-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .player-label .title {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ---------- Equalizer (driven by JS, reflects real playback state) ---------- */
  .eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 18px;
  }

  .eq span {
    display: block;
    width: 3px;
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transform-origin: bottom center;
    /* JS drives this every frame — no CSS transition on transform */
    transform: scaleY(0.06);
    will-change: transform;
    box-shadow: 0 0 7px -1px var(--accent-glow);
    transition: opacity .4s ease, background-color .4s ease;
  }

  /* Bars go dim + static when nothing is playing */
  .eq.is-idle span {
    opacity: .38;
    box-shadow: none;
  }

  /* ---------- Embedded widget container ---------- */
  .embed-slot {
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.04);
    padding: 12px 8px;
    overflow: hidden;
  }

  .embed-slot .cstrEmbed { width: 100%; }

  /* Fallback / loading text before the widget renders */
  .embed-slot .cstrEmbed:not([data-rendered="true"])::before {
    content: "Loading player…";
    display: block;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 30px 0;
  }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    line-height: 1.8;
  }
  footer a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }
  footer a:hover { border-bottom-color: var(--accent); }

  @media (max-width: 480px) {
    body { padding: 24px 14px; }
    .player-card { padding: 20px 14px; border-radius: 18px; }
    .logo { width: 64px; height: 64px; border-radius: 18px; }
    .logo svg { width: 32px; height: 32px; }
  }

  /* Only kill *decorative* CSS motion here; the JS loop checks this flag itself */
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none !important; }
    .player-card { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="wrapper">

    <!-- ===== Header ===== -->
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#67CA22" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="2.4" fill="#67CA22" stroke="none"/>
          <path d="M7.8 7.8a6 6 0 0 0 0 8.4"/>
          <path d="M16.2 16.2a6 6 0 0 0 0-8.4"/>
          <path d="M4.9 4.9a10 10 0 0 0 0 14.2"/>
          <path d="M19.1 19.1a10 10 0 0 0 0-14.2"/>
        </svg>
      </div>

      <div class="live-badge is-idle" id="liveBadge">
        <span class="dot"></span>
        <span id="liveBadgeText">Standby</span>
      </div>

      <h1>Zhao Hai Radio</h1>
      <p class="tagline">Streaming live, around the clock</p>
    </header>

    <!-- ===== Player ===== -->
    <main class="player-card">
      <div class="player-label">
        <span class="title">Now Playing</span>

        <div class="eq is-idle" id="equalizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="embed-slot">
        <!-- ===== Caster.fm Embedded Widget ===== -->
        <div data-type="newStreamPlayer"
             data-publicToken="9d019c31-94e9-470d-807a-2fbfb6df2457"
             data-theme="dark"
             data-color="67CA22"
             data-channelId=""
             data-rendered="false"
             class="cstrEmbed">
          <a href="https://www.caster.fm">Shoutcast Hosting</a>
          <a href="https://www.caster.fm">Stream Hosting</a>
          <a href="https://www.caster.fm">Radio Server Hosting</a>
        </div>
        <!-- ===== /Caster.fm Widget ===== -->
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer>
      &copy; <span id="year"></span> Zhao Hai Radio &middot; All rights reserved<br />
      Powered by <a href="https://www.caster.fm" target="_blank" rel="noopener">Caster.fm</a>
    </footer>

  </div>

  <!-- Dynamic copyright year -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script>
  (function () {
    "use strict";

    /* ---------------- Elements ---------------- */
    var eqEl        = document.getElementById("equalizer");
    var bars        = Array.prototype.slice.call(eqEl.querySelectorAll("span"));
    var badge       = document.getElementById("liveBadge");
    var badgeText   = document.getElementById("liveBadgeText");

    /* ---------------- Tunables ---------------- */
    var IDLE_LEVEL = 0.06;   // resting height (fraction) when silent
    var ATTACK     = 0.55;   // fast rise  — sounds punchy
    var RELEASE    = 0.09;   // slow fall  — looks natural
    var POLL_MS    = 400;

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* Give each bar its own personality + a typical spectrum curve
       (lows/mids stronger, highs weaker). */
    var params = bars.map(function (_, i) {
      return {
        offset: i * 1.73,
        speed:  1.55 + (i % 3) * 0.42,
        gain:   [1.0, 0.92, 0.76, 0.58, 0.44][i] || 0.7,
        level:  IDLE_LEVEL,
        target: IDLE_LEVEL
      };
    });

    /* ---------------- Smooth pseudo-random noise ----------------
       Value noise: deterministic, seamless, and far more "organic"
       than Math.random(), which would look like static.            */
    function hash(n) {
      var s = Math.sin(n * 127.1) * 43758.5453123;
      return s - Math.floor(s);
    }
    function noise(x) {
      var i = Math.floor(x);
      var f = x - i;
      var u = f * f * (3 - 2 * f);           // smoothstep
      return hash(i) * (1 - u) + hash(i + 1) * u;
    }

    /* ---------------- Playback state ---------------- */
    var mediaEl      = null;    // the widget's <audio>/<video>, if reachable
    var isPlaying    = false;   // current resolved state
    var userEngaged  = false;   // has the visitor interacted with the page?
    var rafId        = null;
    var lastFrameTs  = 0;

    /* ---- Signal 1: real media element in this document ---- */
    function findMedia() {
      return document.querySelectorAll("audio, video");
    }

    function mediaIsPlaying(el) {
      return !!el && !el.paused && !el.ended && el.readyState > 2;
    }

    function bindMedia(el) {
      if (mediaEl === el) return;
      mediaEl = el;
      ["play", "playing", "pause", "ended", "emptied",
       "waiting", "stalled", "loadstart", "abort"]
        .forEach(function (ev) {
          el.addEventListener(ev, resolveState, { passive: true });
        });
      resolveState();
    }

    function scanForMedia() {
      if (mediaEl) return;
      var found = findMedia();
      for (var i = 0; i < found.length; i++) {
        bindMedia(found[i]);
        break;
      }
    }

    /* ---- Signal 2: Media Session (works across iframes) ---- */
    function mediaSessionState() {
      try {
        return (navigator.mediaSession && navigator.mediaSession.playbackState) || "none";
      } catch (e) {
        return "none";
      }
    }

    /* ---- Resolve everything into one boolean ---- */
    function resolveState() {
      var next;

      if (mediaEl) {
        // Authoritative: we can see the actual element
        next = mediaIsPlaying(mediaEl);
      } else {
        var ms = mediaSessionState();
        if (ms === "playing") {
          next = true;
        } else if (ms === "paused") {
          next = false;
        } else {
          // Nothing observable — trust the optimistic fallback
          next = userEngaged;
        }
      }

      if (next === isPlaying) return;
      isPlaying = next;
      applyState();
    }

    function applyState() {
      eqEl.classList.toggle("is-idle", !isPlaying);
      badge.classList.toggle("is-idle", !isPlaying);
      badgeText.textContent = isPlaying ? "On Air" : "Standby";

      if (isPlaying) startLoop();
      else if (!rafId) startLoop(); // loop is needed to settle bars back down
    }

    /* ---------------- Animation loop ---------------- */
    function startLoop() {
      if (reduceMotion || rafId !== null) return;
      lastFrameTs = performance.now();
      rafId = requestAnimationFrame(frame);
    }

    function stopLoop() {
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    function frame(now) {
      var t = now / 1000;
      var allSettled = true;

      for (var i = 0; i < params.length; i++) {
        var p = params[i];
        var target;

        if (isPlaying) {
          // Layered noise = lively, non-repeating movement
          var n1 = noise(t * p.speed + p.offset);
          var n2 = noise(t * p.speed * 2.3 + p.offset * 3.1);
          var n3 = noise(t * p.speed * 4.7 + p.offset * 7.9);

          var energy = (n1 * 0.55) + (n2 * 0.30) + (n3 * 0.15);
          target = IDLE_LEVEL + energy * (1 - IDLE_LEVEL) * p.gain;
        } else {
          target = IDLE_LEVEL;
        }

        p.target = target;

        // Asymmetric smoothing: snap up, ease down
        var k = target > p.level ? ATTACK : RELEASE;
        p.level += (target - p.level) * k;

        if (Math.abs(p.level - IDLE_LEVEL) > 0.0015) allSettled = false;

        var scale = Math.max(IDLE_LEVEL, Math.min(1, p.level));
        bars[i].style.transform = "scaleY(" + scale.toFixed(3) + ")";
      }

      // Idle and fully settled → stop burning frames
      if (!isPlaying && allSettled) {
        rafId = null;
        return;
      }

      rafId = requestAnimationFrame(frame);
    }

    /* ---------------- Static mode (reduced motion) ---------------- */
    function renderStatic() {
      var heights = [0.55, 0.78, 0.62, 0.88, 0.48];
      bars.forEach(function (bar, i) {
        var h = isPlaying ? heights[i] : IDLE_LEVEL;
        bar.style.transform = "scaleY(" + h + ")";
      });
    }

    /* ---------------- Wiring ---------------- */

    // Watch for the widget injecting its player into the DOM
    var observer = new MutationObserver(function () {
      scanForMedia();
      resolveState();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety net: events are sometimes unreliable on live streams
    setInterval(function () {
      scanForMedia();
      resolveState();
    }, POLL_MS);

    // First user gesture anywhere → optimistic "on air"
    ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
      window.addEventListener(ev, function () {
        if (userEngaged) return;
        userEngaged = true;
        resolveState();
      }, { passive: true, once: false });
    });

    // Don't animate in a hidden tab
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stopLoop();
      else if (isPlaying) startLoop();
    });

    if (reduceMotion) {
      // Static bars, but still swap between live / idle heights
      var origApply = applyState;
      applyState = function () {
        eqEl.classList.toggle("is-idle", !isPlaying);
        badge.classList.toggle("is-idle", !isPlaying);
        badgeText.textContent = isPlaying ? "On Air" : "Standby";
        renderStatic();
      };
      window.addEventListener("resize", renderStatic);
    }

    /* ---------------- Boot ---------------- */
    scanForMedia();
    if (reduceMotion) renderStatic();
    applyState();
  })();
  </script>

  <!-- ===== Caster.fm Embed Script (must come after the widget div) ===== -->
  <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
</body>
</html>
